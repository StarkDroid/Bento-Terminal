name: Release

# A merged pull request can opt out of a release with a line that is exactly
# /silent, a title ending in /silent, or the "silent" label. The gate job below then skips the
# release and every publish job; CI and Pages still run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check for /silent
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # A manual dispatch always releases.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_silent=0

          # A line containing only /silent in the merge or squash commit.
          if printf '%s\n' "$COMMIT_MESSAGE" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -qx '/silent'; then
            is_silent=1
          fi

          # Or a PR whose title ends in /silent, whose body has a /silent
          # line, or that carries the "silent" label.
          if [ "$is_silent" -eq 0 ]; then
            prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[].number' 2>/dev/null || true)
            for pr in $prs; do
              pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")
              title=$(jq -r '.title // ""' <<<"$pr_json")
              body=$(jq -r '.body // ""' <<<"$pr_json")
              labels=$(jq -r '.labels[]?.name' <<<"$pr_json")
              if printf '%s' "$title" \
                | grep -qE '(^|[[:space:]])/silent[[:space:]]*$'; then
                is_silent=1
              elif printf '%s\n' "$body" \
                | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                | grep -qx '/silent'; then
                is_silent=1
              elif printf '%s\n' "$labels" | grep -qix 'silent'; then
                is_silent=1
              fi
              [ "$is_silent" -eq 1 ] && break
            done
          fi

          if [ "$is_silent" -eq 1 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Release skipped: /silent marker found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --auto

  publish-npm:
    name: publish npm
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.release.outputs.version }}

  publish-packages:
    name: publish packages
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish-managers:
    name: publish managers
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/publish-managers.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish-chocolatey:
    name: publish Chocolatey
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/publish-chocolatey.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
