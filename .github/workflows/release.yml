name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --auto

  publish-npm:
    name: publish npm
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish-packages:
    name: publish packages
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish-managers:
    name: publish managers
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/publish-managers.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish-chocolatey:
    name: publish Chocolatey
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/publish-chocolatey.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
