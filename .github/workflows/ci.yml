name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        if: runner.os != 'Windows'
        run: make build
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -o bento.exe ./cmd/bento
      - name: Upload the Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bento-windows-amd64
          path: bento.exe
          if-no-files-found: error
